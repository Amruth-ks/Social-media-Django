<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Species Details Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ---------- BASE ---------- */
body {
    font-family: system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, rgba(34,197,94,0.25), transparent 60%),
        radial-gradient(circle at bottom right, rgba(56,189,248,0.25), transparent 60%),
        linear-gradient(135deg, #020617, #052e16, #020617);
}

/* ---------- CARD ---------- */
.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    padding: 30px;
    width: 380px;
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    color: #f8fafc;
    animation: cardIn 1s ease forwards;
}

/* ---------- HEADINGS ---------- */
h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: glowText 3s ease-in-out infinite;
}

/* ---------- LABELS ---------- */
label {
    display: block;
    margin-top: 14px;
    font-size: 0.85rem;
    color: #cbd5e1;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
}

label:nth-of-type(1) { animation-delay: .1s; }
label:nth-of-type(2) { animation-delay: .2s; }
label:nth-of-type(3) { animation-delay: .3s; }
label:nth-of-type(4) { animation-delay: .4s; }
label:nth-of-type(5) { animation-delay: .5s; }

/* ---------- INPUTS ---------- */
input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.12);
    color: #f8fafc;
    outline: none;
    transition: all 0.3s ease;
}

input:focus,
textarea:focus,
select:focus {
    transform: scale(1.03);
    box-shadow: 0 0 0 2px rgba(34,197,94,0.6);
    background: rgba(255,255,255,0.18);
}

/* ---------- TEXTAREA COUNT ---------- */
.count {
    font-size: 0.75rem;
    color: #94a3b8;
    text-align: right;
}

/* ---------- STARS ---------- */
.stars {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    font-size: 1.6rem;
}

.stars input {
    display: none;
}

.stars label {
    cursor: pointer;
    color: #334155;
    transition: transform 0.2s, color 0.2s;
}

.stars label:hover {
    transform: scale(1.3) rotate(-5deg);
    color: #22c55e;
}

.stars input:checked ~ label {
    color: #22c55e;
}

/* ---------- BUTTON ---------- */
button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #020617;
    border: none;
    border-radius: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* Button hover lift */
button:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 20px 40px rgba(34,197,94,0.5);
}

/* Button ripple effect */
button::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.6), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
}

button:active::after {
    opacity: 1;
}

/* ---------- ANIMATIONS ---------- */
@keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes glowText {
    0%, 100% { text-shadow: 0 0 8px rgba(34,197,94,0.4); }
    50% { text-shadow: 0 0 20px rgba(34,197,94,0.8); }
}

.money {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 8px 12px;
    transition: box-shadow 0.3s ease, transform 0.3s ease;
}

.money span {
    font-size: 1.1rem;
    font-weight: 700;
    color: #22c55e;
}

.money input {
    flex: 1;
    background: transparent;
    border: none;
    color: #f8fafc;
    font-size: 0.95rem;
    outline: none;
}

/* Focus animation */
.money:focus-within {
    box-shadow: 0 0 0 2px rgba(34,197,94,0.6);
    transform: scale(1.03);
}

</style>


</head>

<body>

<div class="card">
    <h2>Species Information</h2>

    <form>
        <label>Name</label>
        <input type="text" placeholder="Common name">

        <label>Scientific Name</label>
        <input type="text" placeholder="Genus species">

        <label>Image</label>
        <input type="file" accept="image/*">

        <label>Description (max 120 characters)</label>
        <textarea maxlength="120" rows="3"
            oninput="count.textContent = this.value.length + '/120'"></textarea>
        <div class="count" id="count">0/120</div>

        <label>Toxic Level (⭐ 1–5)</label>
        <div class="stars">
            <input type="radio" name="toxic" id="t5"><label for="t5">★</label>
            <input type="radio" name="toxic" id="t4"><label for="t4">★</label>
            <input type="radio" name="toxic" id="t3"><label for="t3">★</label>
            <input type="radio" name="toxic" id="t2"><label for="t2">★</label>
            <input type="radio" name="toxic" id="t1"><label for="t1">★</label>
        </div>

        <label>Cash Value (USD)</label>
<div class="money">
    <span>$</span>
    <input
        type="number"
        name="cash"
        placeholder="0"
        min="0"
        max="1000000000"
        step="1000"
        required
    >
</div>
<small style="color:#94a3b8;font-size:0.75rem">
    Maximum allowed: $1,000,000,000
</small>


</body>
</html>
