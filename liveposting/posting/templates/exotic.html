<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exotic Species</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ---------- PAGE ---------- */
body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(34,197,94,0.35), transparent 60%),
        radial-gradient(circle at bottom right, rgba(56,189,248,0.35), transparent 60%),
        linear-gradient(135deg, #020617, #052e16, #020617);
    font-family: system-ui, sans-serif;
    color: #ecfeff;
    padding: 40px;
}

/* ---------- HEADER ---------- */
h1 {
    text-align: center;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(34,197,94,0.8);
}

/* ---------- TABLE CONTAINER ---------- */
.table-wrap {
    overflow-x: auto;
}

/* ---------- TABLE ---------- */
table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
}

/* ---------- HEAD ---------- */
th {
    background: rgba(34,197,94,0.25);
    padding: 14px;
    text-align: left;
    font-size: 0.85rem;
    letter-spacing: 1px;
}

/* ---------- BODY ---------- */
td {
    padding: 14px;
    font-size: 0.85rem;
    border-top: 1px solid rgba(255,255,255,0.12);
}

/* ---------- ROW EFFECT ---------- */
tr {
    transition: transform 0.3s ease, background 0.3s ease;
}

tr:hover {
    background: rgba(34,197,94,0.12);
    transform: scale(1.01);
}

/* ---------- IMAGE ---------- */
img {
    width: 90px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: transform 0.3s ease;
}

img:hover {
    transform: scale(1.2);
}

/* ---------- CASH ---------- */
.cash {
    font-weight: 700;
    color: #22c55e;
}

/* ---------- ACTIONS ---------- */
.actions a {
    text-decoration: none;
    font-weight: 700;
    margin-right: 18px;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.75rem;
    transition: all 0.25s ease;
}

.actions a.edit {
    background: rgba(56,189,248,0.25);
    color: #e0f2fe;
}

.actions a.edit:hover {
    background: rgba(56,189,248,0.45);
}

.actions a.delete {
    background: rgba(239,68,68,0.25);
    color: #fee2e2;
}

.actions a.delete:hover {
    background: rgba(239,68,68,0.45);
}

/* ---------- NO IMAGE ---------- */
.no-img {
    font-size: 0.7rem;
    color: #94a3b8;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 768px) {
    th, td {
        font-size: 0.75rem;
        padding: 10px;
    }
}
</style>
</head>

<body>

<h1>EXOTIC SPECIES</h1>

<div class="table-wrap">
<table>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Image</th>
  <th>Scientific Name</th>
  <th>Description</th>
  <th>Cash Value</th>
  <th>Actions</th>
</tr>

{% for x in exotics %}
<tr>
  <td>{{ x.id }}</td>
  <td>{{ x.name }}</td>

  <td>
    {% if x.image %}
      <img src="{{ x.image.url }}" alt="{{ x.name }}">
    {% else %}
      <span class="no-img">No Image</span>
    {% endif %}
  </td>

  <td><em>{{ x.scientific_name }}</em></td>
  <td>{{ x.description }}</td>
  <td class="cash">${{ x.cash_value }}</td>

  <td class="actions">
    <a href="{% url 'edit_species' x.id %}" class="edit">Edit</a>
    <a href="{% url 'delete_species' x.id %}"
       class="delete"
       onclick="return confirm('Are you sure you want to delete this species?');">
       Delete
    </a>
  </td>
</tr>
{% endfor %}
</table>
</div>

</body>
</html>
